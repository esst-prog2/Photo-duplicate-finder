[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "find-duplicates"
version = "0.1.0"
description = "Find exact and near-duplicate photos in a folder"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "imagehash>=4.3",
    "click>=8.1",
    "openpyxl>=3.1",
]

[project.scripts]
find-duplicates = "find_duplicates.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["find_duplicates*"]

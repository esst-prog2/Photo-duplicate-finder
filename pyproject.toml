[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "find-duplicates"
version = "0.1.0"
description = "Find exact and near-duplicate photos in a folder"
requires-python = ">=3.11"
dependencies = [
    "Pillow==12.3.0",
    "imagehash==4.3.2",
    "click==8.5.0",
    "openpyxl==3.1.5",
]

[project.scripts]
find-duplicates = "find_duplicates.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["find_duplicates*"]
